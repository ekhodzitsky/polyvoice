name: Mutants

# Deliberately schedule-only with NO kill-rate gate: the mutation report is a
# weekly diagnostic, and its caught/total ratio is too noisy across runs to be
# a non-flaky PR gate. Revisit only if the ratio stabilizes.
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: cargo mutants --all-features --timeout 300
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out
