name: Release artifacts

on:
  workflow_call:
    inputs:
      require_registry:
        description: Require published kernels instead of staged package archives
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      require_registry:
        description: Require published kernels (release prerequisite)
        type: boolean
        default: false
  pull_request:
    paths:
      - 'Cargo.*'
      - 'src/**'
      - 'polyvoice-kernels/**'
      - 'python/**'
      - 'include/**'
      - 'scripts/*release-artifacts*'
      - 'scripts/artifact-consumers/**'
      - '.github/workflows/release*.yml'
      - '.github/workflows/python-wheels.yml'
      - '!**/*.md'

permissions:
  contents: read

# Superseded PR builds are disposable; qualified/manual release runs are not.
concurrency:
  group: release-artifacts-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-release-artifacts.py
      - name: Package against published dependencies (release)
        if: inputs.require_registry == true
        run: cargo package --locked --no-verify -p polyvoice
      - name: Package both crates for prepublication consumers (PR/manual)
        if: inputs.require_registry != true
        run: cargo package --locked --no-verify -p polyvoice-kernels -p polyvoice
      - uses: actions/upload-artifact@v4
        with:
          name: rust-packages
          path: target/package/*.crate
          if-no-files-found: error

  consumers:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: polyvoice-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: polyvoice-linux-aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: polyvoice-macos-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: polyvoice-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            python
      - uses: actions/download-artifact@v4
        with:
          name: rust-packages
          path: packages
      # Both Linux targets use Rust kernels; system-openblas stays disabled.
      - name: Verify Windows network isolation before building
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json, pathlib, runpy, tempfile
          gate = runpy.run_path('scripts/smoke-release-artifacts.py')
          report = {}
          with tempfile.TemporaryDirectory(prefix='polyvoice-preflight-') as work:
              gate['offline_prefix'](pathlib.Path(work), gate['compiler_env'](), report)
          print(json.dumps(report, indent=2))
      - run: cargo build --locked --release --features cli,ffi --bin polyvoice --lib --target ${{ matrix.target }}
      - run: python -m pip install 'maturin>=1.15,<2'
      - run: maturin build --manifest-path python/Cargo.toml --locked --release --interpreter python --compatibility pypi --auditwheel check --out wheels
      - name: Assemble the files to be published
        shell: python
        run: |
          import os, pathlib, shutil, sys, zipfile
          target = os.environ['RELEASE_TARGET']
          build = pathlib.Path('target') / target / 'release'
          dist = pathlib.Path('native')
          dist.mkdir()
          shutil.copyfile(build / ('polyvoice.exe' if sys.platform == 'win32' else 'polyvoice'), dist / os.environ['RELEASE_ASSET'])
          libraries = {'linux': ['libpolyvoice.so'], 'darwin': ['libpolyvoice.dylib'], 'win32': ['polyvoice.dll', 'polyvoice.dll.lib']}[sys.platform]
          with zipfile.ZipFile(dist / ('polyvoice-ffi-' + target + '.zip'), 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.write('include/polyvoice.h', 'polyvoice.h')
              for name in libraries:
                  archive.write(build / name, name)
      - name: Install and exercise exact archives in isolated consumers
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          p = pathlib.Path
          command = [sys.executable, 'scripts/smoke-release-artifacts.py',
                     '--cli', str(p('native') / os.environ['RELEASE_ASSET']),
                     '--ffi', str(next(p('native').glob('*.zip'))),
                     '--wheel', str(next(p('wheels').glob('*.whl'))),
                     '--crate', str(next(p('packages').glob('polyvoice-[0-9]*.crate'))),
                     '--cargo-target-dir', str(p('target/artifact-consumer').resolve()),
                     '--report', 'reports/artifacts-' + os.environ['RELEASE_TARGET'] + '.json']
          kernels = list(p('packages').glob('polyvoice-kernels-*.crate'))
          if kernels:
              command += ['--staged-kernel', str(kernels[0])]
          subprocess.run(command, check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: wheels/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-reports-${{ matrix.target }}
          path: reports/*.json
          if-no-files-found: error
