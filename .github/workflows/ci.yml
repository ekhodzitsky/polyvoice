name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            flags: --all-targets --all-features
          - os: macos-latest
            flags: --all-targets --features onnx,ffi,cli
          - os: windows-latest
            flags: --all-targets --features onnx,ffi,cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check ${{ matrix.flags }}

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --check

  clippy:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            flags: --all-targets --all-features
          - os: macos-latest
            flags: --all-targets --features onnx,ffi,cli
          - os: windows-latest
            flags: --all-targets --features onnx,ffi,cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.os }}-${{ hashFiles('Cargo.toml', '**/Cargo.toml', '**/Cargo.lock') }}
          cache-on-failure: false
      - name: cargo clippy
        shell: bash
        run: cargo clippy ${{ matrix.flags }} -- -D warnings 2>&1 | tee clippy.log
      - name: upload clippy log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log-${{ matrix.os }}
          path: clippy.log

  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            flags: --all-features
          - os: macos-latest
            flags: --features onnx,ffi,cli
          - os: windows-latest
            flags: --features onnx,ffi,cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test ${{ matrix.flags }}

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --all-features --lib --tests --cobertura --output-path cobertura.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: cargo miri test
        run: |
          cargo miri test --features ffi --lib
          cargo miri test --features ffi --test test_ahc
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (loom)
        run: cargo test --test loom_pool
        env:
          LOOM_MAX_PREEMPTIONS: 3

  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: cargo semver-checks
        run: cargo semver-checks check-release

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  cross-aarch64-linux:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install gcc-aarch64-linux-gnu (linker for cross-compile)
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: cargo check (aarch64-linux, default features)
        run: cargo check --target aarch64-unknown-linux-gnu
      - name: cargo check (aarch64-linux, download feature)
        run: cargo check --target aarch64-unknown-linux-gnu --features download

  wasm32-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (wasm32, no default features, no onnx)
        run: cargo check --target wasm32-unknown-unknown --no-default-features --lib

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download ONNX models
        run: cargo run --features cli --bin polyvoice -- download-models --profile balanced
      - name: Run E2E smoke test
        run: cargo test --test e2e_smoke_test --features "onnx download" -- --ignored --nocapture

  e2e-der-regression:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: data/ami-test-single
          key: ami-test-single-${{ hashFiles('scripts/download-ami-test-single.sh') }}
      - uses: actions/cache@v4
        with:
          path: data/voxconverse-test
          key: voxconverse-test-${{ hashFiles('scripts/download-voxconverse-test.sh') }}
      - name: Download e2e-smoke test data
        run: bash scripts/download-ami-test-single.sh
      - name: Download VoxConverse test data
        run: bash scripts/download-voxconverse-test.sh
      - name: Download ONNX models
        run: cargo run --features cli --bin polyvoice -- download-models --profile balanced
      - name: Run DER regression — legacy e2e_smoke
        run: cargo test --test der_regression_test --features "onnx download" der_regression_e2e_smoke -- --ignored --nocapture 2>&1 | tee -a der-regression.log
      - name: Run DER regression — legacy VoxConverse 10-file
        run: cargo test --test der_regression_test --features "onnx download" der_regression_voxconverse_10_file_subset -- --ignored --nocapture 2>&1 | tee -a der-regression.log
      - name: Run DER regression — pipeline v2 e2e_smoke
        run: cargo test --test pipeline_v2_integration --features "onnx,segmentation,embedder,clusterer,resegmentation,download" -- --ignored --nocapture 2>&1 | tee -a der-regression.log
      - name: Upload DER regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: der-regression-log
          path: der-regression.log

  sign-manifest-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install minisign
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
      - name: Run sign-models.sh --dry-run
        run: ./scripts/sign-models.sh --dry-run

  perf-regression:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: data/voxconverse-test
          key: voxconverse-test-${{ hashFiles('scripts/download-voxconverse-test.sh') }}
      - name: Download VoxConverse test data
        run: bash scripts/download-voxconverse-test.sh
      - name: Download ONNX models
        run: cargo run --features cli --bin polyvoice -- download-models --profile balanced
      - name: Run perf regression test
        run: cargo test --test perf_regression_test --features "onnx download" -- --ignored --nocapture 2>&1 | tee perf-regression.log
      - name: Upload perf regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-regression-log
          path: perf-regression.log
