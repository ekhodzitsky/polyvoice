name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: --all-targets --all-features
          - os: macos-latest
            flags: --all-targets --features cli
          - os: windows-latest
            flags: --all-targets --features cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pin a complete, present Xcode on macOS: the floating `macos-latest`
      # image intermittently leaves a default selection whose clang runtime
      # (`libclang_rt.osx.a`) is missing, breaking the link with
      # `ld: library 'clang_rt.osx' not found`. Selecting latest-stable makes
      # the clang resource dir deterministic.
      - if: runner.os == 'macOS'
        id: xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Key the cache to the Xcode version: build-script outputs embed
          # absolute toolchain paths, so a cache built under another Xcode
          # poisons the link line (dead -L search paths, missing clang_rt).
          key: xcode-${{ steps.xcode.outputs.version }}
      - run: cargo check ${{ matrix.flags }} --locked

  standalone-lockfiles:
    # python/, fuzz/, and polyvoice-asr-sherpa/ build outside the workspace with
    # their own lockfiles — prove none of them drifted out of sync with its
    # manifest (a version bump or feature edit in the core crate invalidates
    # them silently). Resolution-only check; no compilation.
    # Shared with scripts/release-check.sh via check-standalone-lockfiles.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/check-standalone-lockfiles.sh

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: --all-targets --all-features
          - os: macos-latest
            flags: --all-targets --features cli
          - os: windows-latest
            flags: --all-targets --features cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # See the `check` job: deterministic Xcode so macOS linking is stable.
      - if: runner.os == 'macOS'
        id: xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # clippy-scoped cache, additionally keyed to the Xcode version:
          # build-script outputs embed absolute toolchain paths, so a cache
          # built under another Xcode poisons the link line.
          key: clippy-xcode-${{ steps.xcode.outputs.version }}-${{ matrix.os }}-${{ hashFiles('Cargo.toml', '**/Cargo.toml', '**/Cargo.lock') }}
          cache-on-failure: false
      - shell: bash
        run: cargo clippy ${{ matrix.flags }} -- -D warnings 2>&1 | tee clippy.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log-${{ matrix.os }}
          path: clippy.log

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: --all-features
          - os: macos-latest
            flags: --features cli
          - os: windows-latest
            flags: --features cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # See the `check` job: deterministic Xcode so macOS linking is stable.
      - if: runner.os == 'macOS'
        id: xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Key the cache to the Xcode version: build-script outputs embed
          # absolute toolchain paths, so a cache built under another Xcode
          # poisons the link line (dead -L search paths, missing clang_rt).
          key: xcode-${{ steps.xcode.outputs.version }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --profile ci ${{ matrix.flags }} --locked

  asr-companion:
    # Opt-in ASR companion (polyvoice-asr). Enforces the shared-runtime invariant
    # (one ort version across the workspace) and builds/tests the crate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Single shared ort across the workspace
        run: bash scripts/check-ort-version.sh
      - run: cargo clippy -p polyvoice-asr --all-targets --locked -- -D warnings
      # The transcribe binary sits behind required-features = ["cli"], so the
      # default-feature pass above never compiles it — check it explicitly.
      - run: cargo clippy -p polyvoice-asr --all-targets --features cli --locked -- -D warnings
      - run: cargo test -p polyvoice-asr --locked

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The *.onnx blobs are gitignored; tests that exercise ONNX inference
      # skip without them, which would under-measure coverage. Fetch the four
      # FP32 models (cached across runs) so the instrumented run sees them.
      - uses: actions/cache@v4
        with:
          path: models
          key: coverage-models-${{ hashFiles('scripts/download-models.sh') }}
      - run: bash scripts/download-models.sh
      - run: cargo llvm-cov nextest --profile ci --all-features --cobertura --output-path cobertura.xml --fail-under-lines 90
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cobertura.xml
      - uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # BLOCKING lane: these three targets are confirmed green + deterministic
  # under miri, so a UB regression in them fails the PR. Broader/experimental
  # miri coverage belongs in a separate non-blocking lane, not here.
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo miri test --features ffi --test ffi_smoke_test ffi_create
          cargo miri test --features resegmentation --test miri_resegmentation
          cargo miri test --features ffi --test test_ahc
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cargo test --features ffi --test ffi_smoke_test --no-run
      - name: Run under valgrind
        run: |
          BIN=$(find target/debug/deps -maxdepth 1 -name 'ffi_smoke_test-*' -type f -executable | head -1)
          valgrind --leak-check=full --errors-for-leak-kinds=definite --error-exitcode=1 \
            "$BIN" ffi_create_invalid_profile_returns_invalid_arg ffi_create_null_out_handle_returns_error

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test loom_pool
        env:
          LOOM_MAX_PREEMPTIONS: 3

  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - run: cargo semver-checks check-release

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories licenses bans sources

  # Relative markdown links under README/docs/python/examples (no network).
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal markdown links
        run: bash scripts/check-docs-links.sh

  hack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack check --feature-powerset --depth 2 --lib --bins

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Declared MSRV is 1.88 (matches ort 2.0.0-rc.11+). Keep this pin in
      # lockstep with package.rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib
      # Real (ort-enabled) surface also builds on the declared MSRV.
      - run: cargo check --lib --features "onnx,segmentation,embedder,clusterer,resegmentation"

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
        with:
          args: "--lib"

  cross-aarch64-linux:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo check --target aarch64-unknown-linux-gnu
      - run: cargo check --target aarch64-unknown-linux-gnu --features download
      # XNNPACK is the auto() default EP on aarch64 Linux — prove the wiring
      # type-checks on the real target.
      - run: cargo check --target aarch64-unknown-linux-gnu --features xnnpack

  # CJK ASR companion: builds OUTSIDE the workspace on purpose — sherpa-onnx
  # is a second C++ ONNX runtime and must never enter the core dependency
  # graph. This job proves the crate builds/tests standalone AND that the
  # core tree stays sherpa-free.
  asr-sherpa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: polyvoice-asr-sherpa
      - name: isolation — no sherpa in the core dependency tree
        run: |
          if cargo tree -e no-dev | grep -qi sherpa; then
            echo "LEAK: sherpa entered the core dependency graph"; exit 1
          fi
          echo CLEAN
      # rust-cache restores target/ without the external sherpa-rs binary cache
      # (~/.cache/sherpa-rs), so a cached build can link against missing native
      # libraries. Force the build script to rerun and re-download them.
      - name: Force sherpa-rs-sys build-script rerun
        run: cargo clean -p sherpa-rs-sys --manifest-path polyvoice-asr-sherpa/Cargo.toml
      - run: cargo test --manifest-path polyvoice-asr-sherpa/Cargo.toml --locked
      - run: cargo clippy --manifest-path polyvoice-asr-sherpa/Cargo.toml --all-targets --locked -- -D warnings

  # Hard gate: the intentional ort-free library path (default = []) must never
  # pull `ort` into its normal dependency graph. Consumers (BYO embedder +
  # EnergyVad + Pipeline / StreamingPipeline) rely on this for pure-Rust /
  # no-native-dylib builds. Fail the PR if a feature regression reintroduces
  # dep:ort. Also check + test the default-free lib surface.
  ort-free-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: zero-deps invariants (no ort/earshot/tract in pure-Rust surfaces)
        run: bash scripts/check-zero-deps.sh
      - run: cargo check --no-default-features --lib --locked
      - run: cargo test --no-default-features --lib --locked
      - run: cargo test --no-default-features --test byo_embedder_library --locked
      - run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
      # Pure-Rust feature combo used by BYO-embedder consumers (clustering + VBx).
      - run: cargo check --no-default-features --features clusterer,vbx --lib --locked
      - run: cargo test --no-default-features --features clusterer,vbx --lib --locked
      - run: cargo test --no-default-features --features clusterer,vbx --test library_vbx_from_dir --locked
      - run: cargo clippy --no-default-features --features clusterer,vbx --all-targets --locked -- -D warnings
      # Hand-written kernels + kernel-only CLI (no ort, no tract).
      - run: cargo test -p polyvoice-kernels --locked
      - run: cargo clippy -p polyvoice-kernels --all-targets --locked -- -D warnings
      - run: cargo test --no-default-features --features cli-native --test cli_native_smoke --locked
      - run: cargo clippy --no-default-features --features cli-native --all-targets --locked -- -D warnings

  wasm32-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown --no-default-features --lib

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t polyvoice:ci .
      - name: Smoke-test diarize in container
        run: |
          # Default path is v2+VBx (0.11+); mount checked-in PLDA fixtures so the
          # container does not need POLYVOICE_VBX_PLDA_DIR baked into the image.
          docker run --rm \
            -v "${{ github.workspace }}/tests/data/e2e-smoke/audio:/audio" \
            -v "${{ github.workspace }}/fixtures/vbx-plda:/plda:ro" \
            -e POLYVOICE_VBX_PLDA_DIR=/plda \
            polyvoice:ci diarize /audio/fuzfh.wav --output /audio/out.rttm
          test -s tests/data/e2e-smoke/audio/out.rttm

  e2e-der-regression:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: legacy-e2e-smoke
            test: der_regression_e2e_smoke
            test_flags: "--test der_regression_test --features onnx,download"
            data_key: e2e-smoke-bundled
            data_path: tests/data/e2e-smoke
          - name: legacy-ami-single
            test: der_regression_ami_test_single
            test_flags: "--test der_regression_test --features onnx,download"
            data_script: scripts/download-ami-test-single.sh
            data_key: ami-test-single
            data_path: data/ami-test-single
          - name: pipeline-v2
            test_flags: "--test pipeline_v2_integration --features onnx,segmentation,embedder,clusterer,resegmentation,download"
            data_key: e2e-smoke-bundled
            data_path: tests/data/e2e-smoke
          - name: pipeline-v2-ami
            test: v2_der_ami_test_single
            test_flags: "--test der_v2_baseline_test --features onnx,segmentation,embedder,clusterer,resegmentation,download"
            data_script: scripts/download-ami-test-single.sh
            data_key: ami-test-single
            data_path: data/ami-test-single
          - name: pipeline-v2-notsofar
            test: v2_der_notsofar_3_file_subset
            test_flags: "--test der_v2_baseline_test --features onnx,segmentation,embedder,clusterer,resegmentation,download,vbx"
            data_script: scripts/download-notsofar.sh
            data_key: notsofar-dev
            data_path: data/notsofar-dev
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/polyvoice/models
          key: models-balanced-${{ hashFiles('src/models/manifest.rs') }}
      - uses: actions/cache@v4
        if: matrix.data_script
        with:
          path: ${{ matrix.data_path }}
          key: ${{ matrix.data_key }}-${{ hashFiles(format('{0}.sh', matrix.data_script)) }}
      - name: Download external test data
        if: matrix.data_script
        run: bash ${{ matrix.data_script }}
      - name: Download ONNX models
        run: cargo run --features cli --bin polyvoice -- download-models --profile balanced
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run DER regression — ${{ matrix.name }}
        shell: bash
        run: cargo nextest run --profile ci --run-ignored only ${{ matrix.test_flags }} ${{ matrix.test }} --nocapture 2>&1 | tee der-regression.log
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: der-regression-log-${{ matrix.name }}
          path: der-regression.log
        continue-on-error: true

  perf-regression:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: data/voxconverse-test
          key: voxconverse-test-${{ hashFiles('scripts/download-voxconverse-test.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/polyvoice/models
          key: models-balanced-${{ hashFiles('src/models/manifest.rs') }}
      - run: bash scripts/download-voxconverse-test.sh
      - run: cargo run --features cli --bin polyvoice -- download-models --profile balanced
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run perf regression test
        shell: bash
        run: cargo nextest run --profile ci --run-ignored only --test perf_regression_test --features "onnx download" --nocapture 2>&1 | tee perf-regression.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-regression-log
          path: perf-regression.log

  e2e-der-regression-voxconverse:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'schedule'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/polyvoice/models
          key: models-balanced-${{ hashFiles('src/models/manifest.rs') }}
      - uses: actions/cache@v4
        with:
          path: data/voxconverse-test
          key: voxconverse-test-${{ hashFiles('scripts/download-voxconverse-test.sh') }}
      - run: bash scripts/download-voxconverse-test.sh
      - run: cargo run --features cli --bin polyvoice -- download-models --profile balanced
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run DER regression — VoxConverse 10-file
        shell: bash
        run: cargo nextest run --profile ci --run-ignored only --test der_regression_test --features onnx,download der_regression_voxconverse_10_file_subset --nocapture 2>&1 | tee der-regression.log
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: der-regression-log-voxconverse-10
          path: der-regression.log
        continue-on-error: true

  sign-manifest-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y minisign
      - run: ./scripts/sign-models.sh --dry-run
