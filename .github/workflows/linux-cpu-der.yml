name: Linux CPU DER gate

# Non-Apple product-truth DER on CPU (INT8, powerset N=8).
#
# Modes:
#   smoke (schedule + default dispatch): Vox 10-file subset + full AMI-16.
#     AMI is DER-asserted against ami_test_linux_cpu; Vox is EP/files smoke only.
#   full (workflow_dispatch mode=full): requires 232 Vox + 16 AMI on disk.
#     CI only has the 10-file Vox asset unless a cache provides the full split —
#     full mode fails hard if files are short (intentional).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (Vox≤10 + AMI-16 assert) or full (Vox-232 + AMI-16 assert)"
        required: false
        default: "smoke"
        type: choice
        options:
          - smoke
          - full
  schedule:
    # Weekly Sunday 04:00 UTC — smoke path keeps the harness green.
    - cron: "0 4 * * 0"

concurrency:
  group: linux-cpu-der-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-cpu-der:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MODE: ${{ github.event.inputs.mode || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ort.pyke.io
          key: ort-dfbin-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/polyvoice/models
          key: models-balanced-${{ hashFiles('src/models/manifest.toml', 'src/models/manifest.rs') }}
      - uses: actions/cache@v4
        with:
          path: data/ami-test
          key: ami-test-${{ hashFiles('scripts/download-ami-test.sh') }}
      - uses: actions/cache@v4
        with:
          path: data/voxconverse-test
          key: voxconverse-test-${{ hashFiles('scripts/download-voxconverse-test.sh') }}

      - name: Datasets (hard fail)
        run: |
          set -euo pipefail
          bash scripts/download-ami-test.sh
          bash scripts/download-voxconverse-test.sh
          ami=$(find data/ami-test/audio -name '*.wav' 2>/dev/null | wc -l | tr -d ' ')
          vox=$(find data/voxconverse-test/audio -name '*.wav' 2>/dev/null | wc -l | tr -d ' ')
          echo "AMI wavs: $ami"
          echo "Vox wavs: $vox"
          test "$ami" -ge 16
          if [ "$MODE" = "full" ]; then
            test "$vox" -ge 232
          else
            test "$vox" -ge 10
          fi

      - name: Models (hard fail)
        run: cargo run --release --features cli --bin polyvoice -- download-models --profile balanced

      - name: Linux CPU DER gate (ort)
        env:
          OUT: benchmarks/results/linux-cpu-der-ci
          EP: cpu
          FEATURES: cli-ort
          POLYVOICE_POWERSET_BATCH_SIZE: "8"
          POLYVOICE_VBX_PLDA_DIR: ${{ github.workspace }}/fixtures/vbx-plda
          ASSERT_BASELINE: "1"
          BASELINE_JSON: ${{ github.workspace }}/tests/der_baseline.json
        run: |
          set -euo pipefail
          if [ "$MODE" = "full" ]; then
            export MAX_VOX=0 MAX_AMI=0
          else
            # Smoke: AMI full (asserted); Vox 10-file subset (EP/files only).
            export MAX_VOX=10 MAX_AMI=0
          fi
          bash scripts/linux-cpu-der-gate.sh

      - name: Linux CPU DER gate (native, no ort)
        env:
          OUT: benchmarks/results/linux-cpu-native-der-ci
          EP: cpu
          FEATURES: cli
          POLYVOICE_POWERSET_BATCH_SIZE: "8"
          POLYVOICE_VBX_PLDA_DIR: ${{ github.workspace }}/fixtures/vbx-plda
          ASSERT_BASELINE: "1"
          BASELINE_JSON: ${{ github.workspace }}/tests/der_baseline.json
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenblas-dev pkg-config
          if [ "$MODE" = "full" ]; then
            export MAX_VOX=0 MAX_AMI=0
          else
            export MAX_VOX=10 MAX_AMI=0
          fi
          bash scripts/linux-cpu-native-der-gate.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-cpu-der-reports-${{ env.MODE }}
          path: |
            benchmarks/results/linux-cpu-der-ci/
            benchmarks/results/linux-cpu-native-der-ci/
          if-no-files-found: warn
