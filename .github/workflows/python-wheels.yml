name: Python Wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - os: windows-latest
            target: x64
          - os: macos-latest
            target: aarch64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ matrix.os != 'macos-latest' }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          working-directory: python
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist/*.whl

  # NOTE: PyPI publishing is owned SOLELY by release.yml (tag-triggered, OIDC
  # trusted publishing). This workflow is manual (workflow_dispatch) and
  # BUILD-ONLY — it must never publish, to avoid duplicate-version races.
