name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # release-check.sh runs fmt/clippy/nextest plus VoxConverse 10-file and
    # AMI DER. Debug CLI AMI (EN2002a) exceeded both 60- and 90-minute caps;
    # DER steps in that script now use --release. 120 minutes covers a cold
    # cache plus the remaining compile graphs.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch successful measurements of this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          run_id=$(gh run list --workflow release-quality.yml --commit "$revision" \
            --branch master --event workflow_dispatch --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "No successful release-quality measurement for $revision" >&2
            exit 1
          fi
          for platform in Linux-x86_64 Darwin-arm64; do
            gh run download "$run_id" --name "quality-$platform" \
              --dir "bench-results/release-quality/$platform"
          done
          python3 scripts/release-quality.py verify --evidence bench-results/release-quality
          printf '%s\n' "$run_id" > bench-results/release-quality/source-workflow-run.txt
      - name: Retain verified release measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-quality-evidence
          path: bench-results/release-quality/
          if-no-files-found: error
          retention-days: 90
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Cache the hash-pinned native ONNX Runtime that ort-sys downloads
      # (verified against the SHA-256 embedded in the crate; see
      # docs/security/ort-native-binary-provenance.md). Keyed by Cargo.lock —
      # an ort bump re-pins the binary. A cache miss makes any cold network
      # fetch observable in the log.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/ort.pyke.io
          key: ort-dfbin-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2
        with:
          tool: cargo-nextest,cargo-audit,cargo-deny
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/ami-test-single
          key: ami-test-single-${{ hashFiles('scripts/download-ami-test-single.sh') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/voxconverse-test
          key: voxconverse-test-${{ hashFiles('scripts/download-voxconverse-test.sh') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/polyvoice/models
          key: models-balanced-${{ hashFiles('src/models/manifest.rs') }}
      - run: bash scripts/download-ami-test-single.sh
      - run: bash scripts/download-voxconverse-test.sh
      - run: cargo run --features cli --bin polyvoice -- download-models --profile balanced
      - name: Install OpenBLAS for all-features validation
        run: sudo apt-get update -qq && sudo apt-get install -y libopenblas-dev pkg-config
      - run: bash scripts/release-check.sh

  artifacts:
    needs: [gate]
    uses: ./.github/workflows/release-artifacts.yml
    with:
      require_registry: true

  crates-io:
    needs: [gate, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/download-artifact@v4
        with:
          name: rust-packages
          path: tested-packages
      - name: Reproduce the tested crate before publication
        run: |
          cargo package --locked --no-verify -p polyvoice
          cmp tested-packages/polyvoice-*.crate target/package/polyvoice-*.crate
      # TODO(follow-up): migrate to crates.io trusted publishing (OIDC).
      # Token supplied via env so it never appears in the process argv / command logs.
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: [artifacts, crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*

  pypi-publish:
    needs: [artifacts, crates-io]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
