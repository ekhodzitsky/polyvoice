[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "polyvoice"
version = "0.12.0"
description = "Speaker diarization for Python — who spoke when. Rust + ONNX, no Python runtime overhead. K-means/AHC clustering, overlap detection."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["diarization", "speaker", "audio", "speech", "onnx", "clustering", "vad", "voice-activity-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ekhodzitsky/polyvoice"
Repository = "https://github.com/ekhodzitsky/polyvoice"

[tool.maturin]
python-source = "."
module-name = "polyvoice._polyvoice"
features = ["pyo3/extension-module"]
