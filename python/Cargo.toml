[package]
name = "polyvoice-python"
version = "0.9.0"
edition = "2024"
publish = false

[lib]
name = "_polyvoice"
crate-type = ["cdylib"]

[dependencies]
polyvoice = { path = "..", features = ["onnx", "download", "segmentation", "embedder", "clusterer", "resegmentation"] }
pyo3 = { version = "0.28", features = ["extension-module"] }
