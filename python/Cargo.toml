[package]
name = "polyvoice-python"
version = "0.21.0"
edition = "2024"
# Tracks the core crate's MSRV (the path dependency on polyvoice requires 1.94);
# pyo3 itself is fine with older toolchains.
rust-version = "1.94.0"
publish = false

[lib]
name = "_polyvoice"
crate-type = ["cdylib"]

[dependencies]
# Same production stack as `cli`: INT8 kernels, no libonnxruntime.
polyvoice = { path = "..", features = ["pipeline-native", "vbx"] }
pyo3 = { version = "0.28", features = ["extension-module"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
