[package]
name = "polyvoice-kernels"
version = "0.1.2"
edition = "2024"
rust-version = "1.94.0"
description = "Hand-written WeSpeaker ResNet34 kernels for polyvoice — not a general ONNX runtime."
license = "MIT"
repository = "https://github.com/ekhodzitsky/polyvoice"

[features]
default = []
# Linux-only LP64 OpenBLAS; other targets keep their native implementation.
system-openblas = ["dep:pkg-config"]

[dependencies]
# Pure-Rust GEMM (INT8 + FP32, NEON/dotprod/AVX). Justified: Linux has no
# BNNS/AMX; OpenBLAS in the Desktop VM is ~10 GFLOP/s. Not a second ONNX
# runtime — only matmul. Apple still uses BNNS/Accelerate at runtime.
rten-gemm = "0.25"
rten-tensor = "0.25"
thiserror = "2"
# Pure-Rust mmap so ONNX weight bytes stay file-backed (shared across
# file workers, reclaimable under pressure). Heap `fs::read` made the
# same 8.4 MB pair private anonymous pages. Do not madvise(DONTNEED)
# the mapping — that re-faults the whole file on the next forward.
memmap2 = "0.9"

[build-dependencies]
cc = "1"
pkg-config = { version = "0.3", optional = true }

[lints.clippy]
unwrap_used = "deny"
# Hand-tuned numeric kernels: wide kernel signatures, weight-scale literals, and
# index-style inner loops are deliberate. Keep semantic lints on; allow the
# style lints that fight this domain.
too_many_arguments = "allow"
excessive_precision = "allow"
needless_range_loop = "allow"
needless_return = "allow"
manual_clamp = "allow"
type_complexity = "allow"
let_and_return = "allow"
approx_constant = "allow"
chunks_exact_to_as_chunks = "allow"
