[package]
name = "polyvoice"
version = "0.7.0"
edition = "2024"
rust-version = "1.85.0"
description = "Speaker diarization for Rust — who spoke when. ONNX-powered: Silero VAD, WeSpeaker embeddings, Pyannote segmentation, K-means/AHC clustering, overlap detection."
license = "MIT"
repository = "https://github.com/ekhodzitsky/polyvoice"
keywords = ["diarization", "speaker", "onnx", "audio", "streaming"]
categories = ["multimedia::audio", "science"]
# Allowlist: ship only what a consumer needs to build/use the crate.
# Everything else — per-module COAD docs (MODULE_CONTRACT/README/TODO), docs/,
# scripts/, tests/, benchmarks/, demo.gif, models/*.onnx — is excluded
# automatically. NOTE: src/models/{manifest.toml,signing.pub.base64}
# are include_str!'d at compile time, and examples/hybrid_benchmark.rs +
# benches/der_ami.rs are declared targets — all MUST stay listed or the published
# crate fails to build/package.
include = [
  "src/**/*.rs",
  "src/models/manifest.toml",
  "src/models/signing.pub.base64",
  "benches/der_ami.rs",
  "examples/hybrid_benchmark.rs",
  "include/*.h",
  # Leading slash anchors to the package root — a bare name matches at ANY depth
  # (gitignore globbing), which would drag in every per-module README.md etc.
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[package.metadata.release]
sign-tag = true
tag-name = "v{{version}}"
pre-release-commit-message = "chore(release): prepare for {{version}}"
tag-message = "chore(release): {{version}}"
pre-release-replacements = [
    { file = "python/Cargo.toml", search = "^version = \".*\"", replace = "version = \"{{version}}\"" },
    { file = "python/pyproject.toml", search = "^version = \".*\"", replace = "version = \"{{version}}\"" },
    { file = "tests/cli_smoke_test.rs", search = "polyvoice [0-9]+\\.[0-9]+\\.[0-9]+", replace = "polyvoice {{version}}" },
]

# docs.rs builds with default features (default = []), which would hide the
# entire ONNX / pipeline_v2 API. Document the v1.0 surface explicitly.
# TODO: drop the ort RC pin once ort 2.0.0 stable lands.
[package.metadata.docs.rs]
features = ["onnx", "segmentation", "embedder", "clusterer", "resegmentation", "download", "spectral"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# ONNX-based embedding extractors (pulls ort).
onnx = ["dep:ort"]
# C FFI bindings (ABI v3). Requires the full pipeline stack.
ffi = ["onnx", "download", "segmentation", "embedder", "clusterer", "resegmentation"]
# Library-level model registry with HTTP downloads + SHA-256 verification.
download = ["dep:ureq", "dep:dirs", "dep:toml", "dep:sha2", "dep:minisign-verify"]
# CLI binary (polyvoice command).
cli = ["onnx", "download", "segmentation", "embedder", "clusterer", "resegmentation", "dep:clap"]

# Execution providers (forward `ort` features). Used by Pipeline implementations from M1+.
coreml = ["onnx", "ort/coreml"]
nnapi = ["onnx", "ort/nnapi"]
xnnpack = ["onnx", "ort/xnnpack"]

# Spectral clustering backend (pulls faer for SVD/eigendecomp).
spectral = ["dep:faer"]

# Powerset speaker segmentation (sherpa-onnx-pyannote-segmentation-3-0).
# The pure-Rust algorithmic core (decoder, aggregator, hungarian) compiles to
# wasm32-clean. The ONNX-backed `PowersetSegmenter` additionally requires `onnx`.
segmentation = []

# v1.0 Embedder trait + CAM++/ResNet34 adapters + EmbedderPool + overlap masking.
# The pure-Rust algorithmic core (trait, overlap mask, pool with mock backend)
# compiles to wasm32-clean. The ONNX-backed `CamPlusPlusExtractor` and
# `ResNet34Adapter` additionally require `onnx`.
embedder = []

# v1.0 Clusterer trait + NME-SC + AHC adapters.
# AHC adapter is wasm32-clean. NME-SC additionally requires `spectral` (which
# pulls `faer`).
clusterer = []

# v1.0 Overlap-aware post-clustering resegmentation pass.
# Pure-Rust, wasm32-clean — does not require `onnx`. Operates on already-
# computed speaker centroids and overlap-region embeddings supplied by the
# caller (M6 Pipeline wires the embedder pool into this).
resegmentation = []

# v1.0 Pipeline + Profile builder API. Requires the full M1–M5 stack — the
# builder loads ONNX through ModelRegistry (download feature) for
# Mobile/Balanced profiles. The module gates itself with a `compile_error!`
# if onnx/segmentation/embedder/clusterer/resegmentation are missing, so
# half-wired feature combos cannot ship.

# Model profile bundles. M0 only emits metadata; CLI uses these to pick which
# manifest entries to ensure(). M5 will introduce INT8 model variants.
profile-mobile = []
profile-balanced = []
profile-all = ["profile-mobile", "profile-balanced"]

[dependencies]
# ONNX Runtime — matches the ecosystem version.
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs"] }

# WAV file I/O
hound = "3.5"

# Lock-free queue for ONNX session pooling
crossbeam-queue = "0.3"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Math / numerics
ndarray = { version = "0.17", default-features = false }
realfft = "3.5"

# CLI (optional)
clap = { version = "4", features = ["derive", "env"], optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
dirs = { version = "6", optional = true }
faer = { version = "0.24.0", features = ["std"], optional = true }
fastrand = "2.4.1"
toml = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
minisign-verify = { version = "0.2.5", optional = true }

[dev-dependencies]
hound = "3.5"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
proptest = "1"
criterion = "0.5"
loom = "0.7.2"
mockall = "0.13"
assert_cmd = "2"
predicates = "3"
insta = { version = "1.47.2", features = ["json"] }

[[example]]
name = "hybrid_benchmark"
required-features = ["onnx", "segmentation", "embedder", "clusterer", "resegmentation", "download"]

[[bench]]
name = "der_ami"
harness = false

[[bin]]
name = "polyvoice"
path = "src/bin/polyvoice.rs"
required-features = ["cli"]

[[bin]]
name = "polyvoice-bench"
path = "src/bin/polyvoice-bench.rs"
required-features = ["cli"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(kani)'] }

[lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
