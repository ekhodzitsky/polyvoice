[workspace]
# The core crate is the workspace root package; the opt-in ASR companion is the
# only added member so they share one ONNX runtime (ort) and one lockfile.
# python/ (maturin) and fuzz/ stay standalone — excluded so their builds and
# lockfiles are unaffected.
members = ["polyvoice-asr"]
exclude = ["python", "fuzz"]
resolver = "2"

[package]
name = "polyvoice"
version = "0.11.0"
edition = "2024"
# MSRV tracks ort-enabled (real) builds: ort 2.0.0-rc.11+ needs Rust 1.88.
# Pure non-ort library features may compile on older toolchains, but CI pins 1.88.
rust-version = "1.88.0"
description = "Speaker diarization for Rust — who spoke when. ONNX path optional: default features are empty (ort-free BYO-embedder core); enable onnx for Silero VAD, WeSpeaker embeddings, and Pyannote segmentation."
license = "MIT"
repository = "https://github.com/ekhodzitsky/polyvoice"
keywords = ["diarization", "speaker", "clustering", "onnx", "streaming"]
categories = ["multimedia::audio", "science"]
# Allowlist: ship only what a consumer needs to build/use the crate.
# Everything else — per-module COAD docs (MODULE_CONTRACT/README/TODO), docs/,
# scripts/, tests/, benchmarks/, demo.gif, models/*.onnx — is excluded
# automatically. NOTE: src/models/{manifest.toml,signing.pub.base64} and
# schema/diarization-result-v1.json are include_str!'d at compile time, and
# examples/hybrid_benchmark.rs + benches/der_ami.rs are declared targets — all
# MUST stay listed or the published crate fails to build/package.
include = [
  "src/**/*.rs",
  "src/models/manifest.toml",
  "src/models/signing.pub.base64",
  "schema/diarization-result-v1.json",
  "benches/der_ami.rs",
  "examples/hybrid_benchmark.rs",
  "include/*.h",
  # Leading slash anchors to the package root — a bare name matches at ANY depth
  # (gitignore globbing), which would drag in every per-module README.md etc.
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/CHANGELOG.md",
]

[package.metadata.release]
sign-tag = true
tag-name = "v{{version}}"
pre-release-commit-message = "chore(release): prepare for {{version}}"
tag-message = "chore(release): {{version}}"
pre-release-replacements = [
    { file = "python/Cargo.toml", search = "^version = \".*\"", replace = "version = \"{{version}}\"" },
    { file = "python/pyproject.toml", search = "^version = \".*\"", replace = "version = \"{{version}}\"" },
    { file = "tests/cli_smoke_test.rs", search = "polyvoice [0-9]+\\.[0-9]+\\.[0-9]+", replace = "polyvoice {{version}}" },
]

# default = [] is intentional: the published default graph is the ort-free
# library core (BYO embedder + EnergyVad + Pipeline / StreamingPipeline).
# docs.rs still documents the full ONNX / pipeline_v2 surface explicitly so
# API pages are not empty of the production path.
# TODO: drop the ort RC pin once ort 2.0.0 stable lands.
[package.metadata.docs.rs]
features = ["onnx", "segmentation", "embedder", "clusterer", "resegmentation", "download", "spectral"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# ONNX-based embedding extractors (pulls ort).
onnx = ["dep:ort"]
# C FFI bindings (ABI v3). Requires the full pipeline stack.
ffi = ["onnx", "download", "segmentation", "embedder", "clusterer", "resegmentation"]
# Library-level model registry with HTTP downloads + SHA-256 verification.
download = ["dep:ureq", "dep:dirs", "dep:toml", "dep:sha2", "dep:minisign-verify"]
# CLI binary (polyvoice command). Includes VBx so the post-gate default path
# (pipeline v2 + VBx) is available without an extra feature flag.
cli = ["onnx", "download", "segmentation", "embedder", "clusterer", "resegmentation", "vbx", "dep:clap", "dep:clap_complete"]

# Multi-format audio decode (symphonia) + resampling to 16 kHz (rubato) for the
# CLI / loading layer. Opt-in only — keeps the default library surface free of
# media-codec deps. Rebuild the CLI with `--features "cli,audio-io"`.
audio-io = ["dep:rubato", "dep:symphonia"]

# Execution providers (forward `ort` features). Used by Pipeline implementations from M1+.
coreml = ["onnx", "ort/coreml"]
nnapi = ["onnx", "ort/nnapi"]
xnnpack = ["onnx", "ort/xnnpack"]

# Pure-Rust ONNX inference via tract (Sonos). Opt-in alternative to ort behind
# InferenceRuntime. Default builds must not pull tract (verify with cargo tree).
# Requires the `onnx` feature so the shared runtime surface is available; ort
# remains the default backend even when this feature is enabled.
# Note: tract-onnx declares MSRV 1.91 — higher than this crate's rust-version
# (1.88). Enabling this feature needs a newer toolchain; we do not bump MSRV.
backend-tract = ["onnx", "dep:tract-onnx"]

# Spectral clustering backend (pulls faer for SVD/eigendecomp).
spectral = ["dep:faer"]

# Powerset speaker segmentation (sherpa-onnx-pyannote-segmentation-3-0).
# The pure-Rust algorithmic core (decoder, aggregator, hungarian) compiles to
# wasm32-clean. The ONNX-backed `PowersetSegmenter` additionally requires `onnx`.
segmentation = []

# ONNX-backed Embedder adapters (CAM++/ResNet34/ERes2NetV2) + docs.rs grouping.
# The pure-Rust Embedder trait, EmbedderPool, and overlap mask are always
# compiled (feature-free library BYO path). Enabling this feature alone adds
# nothing without `onnx`; with `onnx` it exports CamPlusPlusExtractor etc.
embedder = []

# v1.0 Clusterer trait + NME-SC + AHC adapters.
# AHC adapter is wasm32-clean. NME-SC additionally requires `spectral` (which
# pulls `faer`).
clusterer = []

# VBx (Variational Bayes HMM + PLDA) clustering backend. Pure-Rust ndarray
# (wasm32-clean): the inference loop and the runtime PLDA transform need no
# linear-algebra backend because the PLDA diagonalization is precomputed offline.
vbx = ["clusterer"]

# v1.0 Overlap-aware post-clustering resegmentation pass.
# Pure-Rust, wasm32-clean — does not require `onnx`. Operates on already-
# computed speaker centroids and overlap-region embeddings supplied by the
# caller (M6 Pipeline wires the embedder pool into this).
resegmentation = []

# Optional NVIDIA Streaming Sortformer v2 E2E diarizer (≤4 speakers).
# Opt-in only — never default. Requires onnx for InferenceRuntime. Model
# weights are optional download via the model registry (never bundled).
sortformer = ["onnx"]

# Optional pure-Rust earshot VAD (pykeio). Opt-in only — never default.
# Silero remains the production default and the DER-parity reference.
# Weights are compiled into the earshot crate (no ONNX, no download).
# Verify default builds stay free of earshot: `cargo tree -e normal | rg earshot`.
vad-earshot = ["dep:earshot"]

# v1.0 word->speaker attribution join (ASR words -> diarization turns).
# Pure-Rust, wasm32-clean — no onnx/model/IO. Operates only on TimeRange/SpeakerId.
attribution = []

# v1.0 Pipeline + Profile builder API. Requires the full M1–M5 stack — the
# builder loads ONNX through ModelRegistry (download feature) for
# Mobile/Balanced profiles. The module gates itself with a `compile_error!`
# if onnx/segmentation/embedder/clusterer/resegmentation are missing, so
# half-wired feature combos cannot ship.

# Model profile bundles. M0 only emits metadata; CLI uses these to pick which
# manifest entries to ensure(). M5 will introduce INT8 model variants.
profile-mobile = []
profile-balanced = []
profile-all = ["profile-mobile", "profile-balanced"]

# MCP stdio server (agent front door). Opt-in only — NEVER in default. Pulls
# rmcp + schemars + tokio and the full diarization pipeline stack so the `diarize`
# tool can run. `ort` is the SAME crate dependency as the core (polyvoice-mcp is a
# bin in this crate, not a separate crate), so the ONNX Runtime version matches
# automatically — no dual-runtime risk.
# Agent MCP server: same production stack as `cli` (pipeline v2 + VBx default).
mcp = [
    "onnx",
    "download",
    "segmentation",
    "embedder",
    "clusterer",
    "resegmentation",
    "vbx",
    "dep:rmcp",
    "dep:schemars",
    "dep:tokio",
]

[dependencies]
# ONNX Runtime — matches the ecosystem version.
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs"] }
# Pure-Rust ONNX loader/runtime (opt-in via `backend-tract`). Use tract-onnx
# directly rather than the heavier facade crate (which pulls CUDA by default).
tract-onnx = { version = "0.23.4", optional = true, default-features = false }

# Pure-Rust VAD (opt-in via `vad-earshot`). Weights compiled into the crate;
# no ONNX Runtime session. Default builds must not pull this dependency.
earshot = { version = "1.2", optional = true, default-features = true }

# WAV file I/O (always available; multi-format decode is behind `audio-io`)
hound = "3.5"

# Opt-in multi-format audio decode + resampling (feature `audio-io`)
rubato = { version = "4.0", optional = true }
# MPL-2.0: unmodified dependency only — never patch or vendor (see NOTICE).
symphonia = { version = "0.6", optional = true, default-features = true, features = [
    "mp3",
    "aac",
    "isomp4",
    "aiff",
    "caf",
    "alac",
] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Math / numerics
ndarray = { version = "0.17", default-features = false }
realfft = "3.5"

# CLI (optional)
clap = { version = "4", features = ["derive", "env"], optional = true }
clap_complete = { version = "4", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
dirs = { version = "6", optional = true }
faer = { version = "0.24.0", features = ["std"], optional = true }
toml = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
minisign-verify = { version = "0.2.5", optional = true }
rmcp = { version = "1.7.0", default-features = false, features = ["server", "macros", "transport-io"], optional = true }
schemars = { version = "1.2.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"], optional = true }

[dev-dependencies]
hound = "3.5"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
proptest = "1"
criterion = "0.5"
loom = "0.7.2"
mockall = "0.13"
assert_cmd = "2"
predicates = "3"
insta = { version = "1.47.2", features = ["json"] }

[[example]]
name = "hybrid_benchmark"
required-features = ["onnx", "segmentation", "embedder", "clusterer", "resegmentation", "download"]

[[bench]]
name = "der_ami"
harness = false

[[bin]]
name = "polyvoice"
path = "src/bin/polyvoice.rs"
required-features = ["cli"]

[[bin]]
name = "polyvoice-bench"
path = "src/bin/polyvoice-bench.rs"
required-features = ["cli"]

[[bin]]
name = "polyvoice-measure"
path = "src/bin/polyvoice-measure.rs"
required-features = ["cli"]

[[bin]]
name = "polyvoice-mcp"
path = "src/bin/polyvoice-mcp.rs"
required-features = ["mcp"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(kani)'] }

[lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
