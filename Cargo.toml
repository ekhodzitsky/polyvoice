[package]
name = "polyvoice"
version = "0.6.0-alpha.3"
edition = "2024"
description = "Speaker diarization library for Rust — online and offline, ONNX-powered, ecosystem-agnostic"
license = "MIT"
repository = "https://github.com/ekhodzitsky/polyvoice"
keywords = ["diarization", "speaker", "onnx", "stt", "voice"]
categories = ["multimedia::audio", "science"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# ONNX-based embedding extractors (pulls ort).
onnx = ["dep:ort"]
# C FFI bindings (ABI v2). Requires the full pipeline stack.
ffi = ["onnx", "download"]
# Library-level model registry with HTTP downloads + SHA-256 verification.
download = ["dep:ureq", "dep:dirs", "dep:toml", "dep:sha2"]
# CLI binary (polyvoice command).
cli = ["onnx", "download", "dep:clap"]

# Execution providers (forward `ort` features). Used by Pipeline implementations from M1+.
coreml = ["onnx", "ort/coreml"]
nnapi = ["onnx", "ort/nnapi"]
xnnpack = ["onnx", "ort/xnnpack"]

# Spectral clustering backend (pulls faer for SVD/eigendecomp).
spectral = ["dep:faer"]

# Powerset speaker segmentation (sherpa-onnx-pyannote-segmentation-3-0).
# The pure-Rust algorithmic core (decoder, aggregator, hungarian) compiles to
# wasm32-clean. The ONNX-backed `PowersetSegmenter` additionally requires `onnx`.
segmentation = []

# v1.0 Embedder trait + CAM++/ResNet34 adapters + EmbedderPool + overlap masking.
# The pure-Rust algorithmic core (trait, overlap mask, pool with mock backend)
# compiles to wasm32-clean. The ONNX-backed `CamPlusPlusExtractor` and
# `ResNet34Adapter` additionally require `onnx`.
embedder = []

# v1.0 Clusterer trait + NME-SC + AHC adapters.
# AHC adapter is wasm32-clean. NME-SC additionally requires `spectral` (which
# pulls `faer`).
clusterer = []

# v1.0 Overlap-aware post-clustering resegmentation pass.
# Pure-Rust, wasm32-clean — does not require `onnx`. Operates on already-
# computed speaker centroids and overlap-region embeddings supplied by the
# caller (M6 Pipeline wires the embedder pool into this).
resegmentation = []

# v1.0 Pipeline + Profile builder API. Requires the full M1–M5 stack — the
# builder loads ONNX through ModelRegistry (download feature) for
# Mobile/Balanced profiles. The module gates itself with a `compile_error!`
# if onnx/segmentation/embedder/clusterer/resegmentation are missing, so
# half-wired feature combos cannot ship.
pipeline = ["download"]

# Model profile bundles. M0 only emits metadata; CLI uses these to pick which
# manifest entries to ensure(). M5 will introduce INT8 model variants.
profile-mobile = []
profile-balanced = []
profile-all = ["profile-mobile", "profile-balanced"]

[dependencies]
# ONNX Runtime — matches the ecosystem version.
ort = { version = "2.0.0-rc.12", optional = true }

# WAV file I/O
hound = "3.5"

# Lock-free queue for ONNX session pooling
crossbeam-queue = "0.3"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Math / numerics
ndarray = { version = "0.17", default-features = false }
realfft = "3.5"
num-complex = "0.4"

# CLI (optional)
clap = { version = "4", features = ["derive", "env"], optional = true }
ureq = { version = "3", optional = true }
dirs = { version = "6", optional = true }
faer = { version = "0.24.0", features = ["std"], optional = true }
fastrand = "2.4.1"
toml = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
hound = "3.5"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
proptest = "1"
criterion = "0.5"
loom = "0.7.2"

[[bench]]
name = "der_ami"
harness = false

[[bin]]
name = "polyvoice"
path = "src/bin/polyvoice.rs"
required-features = ["cli"]

[[bin]]
name = "polyvoice-bench"
path = "src/bin/polyvoice-bench.rs"
required-features = ["cli"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[profile.release]
lto = true
codegen-units = 1
strip = true
