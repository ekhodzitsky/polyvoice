schema = "polyvoice-models-v2"

# Stage-scoped version aliases (Deepgram diarize_model=latest|v1 pattern).
# Resolution is logged so DER reports record the pin that was actually used.
[aliases.segmenter]
latest = "powerset_fp32"
v1 = "powerset_fp32"

[aliases.embedder]
latest = "wespeaker_resnet34"
v1 = "wespeaker_resnet34"

[aliases.vad]
latest = "silero_vad"
v1 = "silero_vad"

# v0.5 legacy profiles — point at proven FP32 models until v1.0 components
# are validated. Mobile uses CAM++ (512-dim), Balanced uses WeSpeaker ResNet34
# (256-dim). Both share Silero VAD for speech segmentation.
[profiles.mobile]
segmenter = "powerset_fp32"
embedder  = "wespeaker_resnet34"

[profiles.balanced]
segmenter = "powerset_fp32"
embedder  = "wespeaker_resnet34"

