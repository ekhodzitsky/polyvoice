schema = "polyvoice-models-v2"

# Stage-scoped version aliases (Deepgram diarize_model=latest|v1 pattern).
# Resolution is logged so DER reports record the pin that was actually used.
[aliases.segmenter]
latest = "powerset_int8"
v1 = "powerset_int8"

[aliases.embedder]
latest = "resnet34_int8"
v1 = "resnet34_int8"

[aliases.vad]
latest = "silero_vad"
v1 = "silero_vad"

# Shipping profiles — INT8-only production pair (powerset weights-only dynamic
# + ResNet34 static QDQ). ~8.4 MB total vs ~32 MB FP32; several× faster on
# CPU. DER ~parity on VoxConverse-style audio; expect ~+2 pp on AMI meetings.
# FP32 artifacts remain in [models.*] for direct ensure("powerset_fp32") /
# quant tooling only — no profile resolves them.
[profiles.mobile]
segmenter = "powerset_int8"
embedder  = "resnet34_int8"

[profiles.balanced]
segmenter = "powerset_int8"
embedder  = "resnet34_int8"

# Alias of balanced (same INT8 pair); kept so --profile fast keeps working.
[profiles.fast]
segmenter = "powerset_int8"
embedder  = "resnet34_int8"

