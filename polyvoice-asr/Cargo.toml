[package]
name = "polyvoice-asr"
version = "0.10.0"
edition = "2024"
rust-version = "1.94.0"
description = "Opt-in ASR companion for polyvoice: Parakeet TDT word-level transcription via parakeet-rs. Diarization uses native kernels; ort is only for Parakeet."
license = "MIT"
repository = "https://github.com/ekhodzitsky/polyvoice"
keywords = ["asr", "speech-recognition", "parakeet", "diarization", "onnx"]
categories = ["multimedia::audio", "science"]
# Not yet published — the workspace's release pipeline is the sole publisher; flip
# this when the companion is registered.
publish = false

[dependencies]
# Core trait + types only. polyvoice's default features are empty, so NOTHING
# from the ONNX pipeline leaks in here — we only need Asr/AsrError + Word types.
polyvoice = { path = "..", default-features = false }
# Parakeet TDT + native word-level timestamps. MIT OR Apache-2.0.
parakeet-rs = "0.3.6"
# Pin must stay byte-equal to parakeet-rs (and to core's optional `ort`).
# Two `ort` versions in one process means two runtimes (symbol clashes).
# Diarization no longer uses this crate — only Parakeet does.
# scripts/check-ort-version.sh asserts a single version in CI.
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-rustls",
    "copy-dylibs",
] }

# CLI-only deps (gated behind the `cli` feature, used by the transcribe binary).
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
anyhow = { version = "1", optional = true }

[features]
default = []
# transcribe binary: product diarization (kernels, v2 + VBx) plus the
# attribution cascade. Lives here, not in the core crate (package cycle).
# Parakeet still needs `ort` (pinned above); polyvoice itself must not
# enable `onnx` / `pipeline-full`.
cli = [
    "polyvoice/pipeline-native",
    "polyvoice/vbx",
    "polyvoice/attribution",
    "dep:clap",
    "dep:serde",
    "dep:serde_json",
    "dep:anyhow",
]
# Execution providers forwarded into parakeet-rs sessions — mirror core's EP set.
coreml = ["ort/coreml"]
xnnpack = ["ort/xnnpack"]
nnapi = ["ort/nnapi"]

[[bin]]
name = "polyvoice-transcribe"
path = "src/bin/transcribe.rs"
required-features = ["cli"]

# `ort` is a deliberate version-pin + feature-activation dependency (it forces the
# shared ONNX runtime's version and turns on download-binaries), not referenced in
# code — so cargo-machete must not flag it as unused.
[package.metadata.cargo-machete]
ignored = ["ort"]

[lints.clippy]
unwrap_used = "deny"
